name: Semgrep
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep CE
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep \
            sh -c 'git config --global --add safe.directory /src && \
              semgrep scan --config p/default --metrics=off \
                --baseline-commit ${{ github.event.pull_request.base.sha }} \
                --error'
